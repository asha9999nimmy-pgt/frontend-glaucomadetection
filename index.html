<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glaucoma Detection</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg,#7b2ff7,#f107a3);
      padding:20px;
    }

    .container{
      width:100%;
      max-width:450px;
      background:white;
      border-radius:20px;
      padding:30px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    h1{
      color:#7b2ff7;
      margin-bottom:10px;
    }

    p{
      color:#666;
      margin-bottom:20px;
    }

    .upload-box{
      border:2px dashed #d14cff;
      padding:25px;
      border-radius:15px;
      margin-bottom:20px;
      cursor:pointer;
      transition:0.3s;
    }

    .upload-box:hover{
      background:#faf0ff;
    }

    input[type="file"]{
      display:none;
    }

    img{
      width:100%;
      max-height:250px;
      object-fit:contain;
      margin-top:15px;
      border-radius:10px;
      display:none;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,#7b2ff7,#f107a3);
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    button:hover{
      opacity:0.9;
      transform:scale(1.02);
    }

    .result{
      margin-top:20px;
      padding:15px;
      border-radius:12px;
      background:#f7f0ff;
      display:none;
    }

    .prediction{
      font-size:22px;
      font-weight:bold;
      color:#7b2ff7;
    }

    .confidence{
      margin-top:8px;
      color:#444;
    }

    .loading{
      margin-top:15px;
      color:#7b2ff7;
      display:none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Glaucoma Detection</h1>
    <p>Upload a retinal image for glaucoma prediction</p>

    <label class="upload-box" for="imageInput">
      Click to Upload Image
      <input type="file" id="imageInput" accept="image/*">
    </label>

    <img id="preview">

    <button onclick="predictImage()">Predict</button>

    <div class="loading" id="loading">
      Predicting...
    </div>

    <div class="result" id="resultBox">
      <div class="prediction" id="predictionText"></div>
      <div class="confidence" id="confidenceText"></div>
    </div>

  </div>

  <script>

    const API_URL = "https://backend-glaucomadetection.onrender.com/predict";

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");

    imageInput.addEventListener("change", () => {

      const file = imageInput.files[0];

      if(file){
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      }
    });

    async function predictImage(){

      const file = imageInput.files[0];

      if(!file){
        alert("Please upload an image");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      document.getElementById("loading").style.display = "block";
      document.getElementById("resultBox").style.display = "none";

      try{

        const response = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        document.getElementById("loading").style.display = "none";

        document.getElementById("resultBox").style.display = "block";

        document.getElementById("predictionText").innerText =
          "Prediction: " + data.prediction;

        document.getElementById("confidenceText").innerText =
          "Confidence: " + (data.confidence * 100).toFixed(2) + "%";

      }
      catch(error){

        document.getElementById("loading").style.display = "none";

        alert("Error connecting to backend API");
        console.error(error);
      }
    }

  </script>

</body>
</html>
